name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install TD2 (skip psauron/torch — not needed for unit tests)
        run: |
          python -m pip install --upgrade pip
          # CI tests don't invoke psauron, so install runtime deps without it
          # to keep wall-clock cost reasonable (avoids the torch wheel).
          pip install typing-extensions tqdm scipy pandas wheel psutil numpy pytest
          pip install -e . --no-deps

      - name: Show versions
        run: |
          python -c "import TD2; print('TD2', TD2.__version__)"
          python -c "import sys; print('python', sys.version)"

      - name: Run pytest
        run: pytest tests -q
